<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Transparent - Footer Form</title>
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --line: #ffffff;
      --logo-border: #d8d2e6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      padding: 56px 28px;
    }

    .footer-form-wrap {
      max-width: 1260px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 230px minmax(250px, 1fr) minmax(360px, 1.9fr);
      gap: 42px;
      align-items: start;
    }

    .logo-box {
      width: 188px;
      height: 188px;
      border: 7px solid var(--logo-border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: grayscale(100%) brightness(1.15);
    }

    .left-col label,
    .right-col label {
      display: block;
      margin: 0 0 8px;
      font-size: 33px;
      font-weight: 500;
      line-height: 1.1;
    }

    .line-input {
      width: 100%;
      height: 58px;
      margin: 0 0 14px;
      color: var(--text);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      font-size: 24px;
      padding: 8px 0;
      outline: none;
    }

    textarea.message {
      width: 100%;
      min-height: 204px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      font-size: 22px;
      padding: 12px;
      resize: vertical;
      outline: none;
      margin-bottom: 28px;
    }

    .submit-btn {
      min-width: 138px;
      height: 50px;
      padding: 0 28px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .submit-btn[disabled] {
      opacity: 0.7;
      cursor: wait;
    }

    .form-status {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      font-size: 16px;
      line-height: 1.4;
    }

    .form-status.is-visible {
      display: block;
    }

    .form-status.is-success {
      color: #d8f5df;
      border-color: #4fb86f;
      background: #102416;
    }

    .form-status.is-error {
      color: #ffd8d8;
      border-color: #d16c6c;
      background: #2a1111;
    }

    @media (max-width: 920px) {
      .footer-form-wrap {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .logo-box {
        width: 156px;
        height: 156px;
      }
    }
  </style>
</head>
<body>
  <form
    class="footer-form-wrap"
    action="https://automations.livetransparent.com/webhook/lt-form-footer-intake"
    method="POST"
  >
    <div class="logo-box" aria-hidden="true">
      <img src="../livetransparent_logo.png" alt="Transparent logo" />
    </div>

    <div class="left-col">
      <label for="full_name">Name*</label>
      <input id="full_name" class="line-input" type="text" name="full_name" required />

      <label for="email">Email*</label>
      <input id="email" class="line-input" type="email" name="email" required />

      <label for="phone">Phone*</label>
      <input id="phone" class="line-input" type="tel" name="phone" required />
    </div>

    <div class="right-col">
      <label for="message">Message*</label>
      <textarea id="message" class="message" name="message" required></textarea>

      <button class="submit-btn" type="submit">Submit</button>
      <div class="form-status" aria-live="polite"></div>
    </div>
  </form>
  <script>
    (function () {
      var form = document.querySelector('.footer-form-wrap');
      if (!form) return;

      var button = form.querySelector('button[type="submit"]');
      var status = form.querySelector('.form-status');

      function showStatus(message, kind) {
        status.textContent = message;
        status.className = 'form-status is-visible ' + (kind === 'success' ? 'is-success' : 'is-error');
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        button.disabled = true;
        showStatus('Submitting...', 'success');

        try {
          var payload = new URLSearchParams(new FormData(form));
          var response = await fetch(form.action, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
              'Accept': 'application/json, text/plain, */*'
            },
            body: payload.toString()
          });

          if (!response.ok) throw new Error('Request failed');

          form.reset();
          showStatus('Thanks. Your message was sent successfully.', 'success');
        } catch (error) {
          showStatus('Submission failed. Please try again or email ed@livetransparent.com.', 'error');
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
