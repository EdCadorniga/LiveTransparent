<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Transparent - Hero Demo Form</title>
  <style>
    :root {
      --card-bg: #000000;
      --text: #ffffff;
      --border: #e6e6e6;
      --button-bg: #e8e8e8;
      --button-text: #000000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b1210;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .hero-form {
      width: min(420px, 100%);
      background: var(--card-bg);
      border: 3px solid var(--border);
      color: var(--text);
      padding: 22px;
    }

    .hero-form h2 {
      margin: 0;
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1;
      font-weight: 700;
    }

    .hero-form .subhead {
      margin: 10px 0 18px;
      font-size: clamp(24px, 4.2vw, 30px);
      line-height: 1.05;
      font-style: italic;
      font-weight: 400;
    }

    .hero-form input,
    .hero-form textarea {
      width: 100%;
      margin: 0 0 14px;
      padding: 16px 18px;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 20px;
      outline: none;
      border-radius: 0;
    }

    .hero-form input::placeholder,
    .hero-form textarea::placeholder {
      color: #ffffff;
      opacity: 1;
    }

    .hero-form textarea {
      min-height: 110px;
      resize: vertical;
    }

    .hero-form textarea::placeholder {
      font-style: italic;
    }

    .hero-form button {
      margin-top: 4px;
      padding: 12px 22px;
      border: 0;
      border-radius: 0;
      background: var(--button-bg);
      color: var(--button-text);
      font-size: clamp(32px, 5.4vw, 46px);
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form
    id="lt-hero-form"
    class="hero-form"
    action="https://automations.livetransparent.com/webhook/lt-form-demo-intake"
    method="POST"
  >
    <h2>Ready to chat?</h2>
    <div class="subhead">Book a demo.</div>

    <input type="text" name="full_name" placeholder="First & Last Name*" required />
    <input type="email" name="email" placeholder="Email*" required />
    <input type="url" name="website" placeholder="Company Website*" required />
    <textarea name="message" placeholder="How can we help?"></textarea>


    <button type="submit">Book a Demo.</button>
  </form>
</body>
</html>
