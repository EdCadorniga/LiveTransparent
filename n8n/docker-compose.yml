services:
  n8n:
    image: 'n8nio/n8n:2.36.8'
    restart: unless-stopped
    environment:
      N8N_CONCURRENCY: '10'
      DB_POSTGRESDB_POOL_SIZE: '10'
      DB_POSTGRESDB_CONNECTION_TIMEOUT: '3000'
      DB_CONNECTION_ACQUISITION_TIMEOUT_MS: '10000'
      DB_POSTGRESDB_STATEMENT_TIMEOUT: '300000'
      DB_PING_TIMEOUT_MS: '5000'
      EXECUTIONS_TIMEOUT: '1800'
      EXECUTIONS_TIMEOUT_MAX: '3600'
      N8N_RUNNERS_MODE: 'external'
      N8N_RUNNERS_AUTH_TOKEN: '${N8N_RUNNERS_AUTH_TOKEN:?Set the runner authentication token}'
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: '0.0.0.0'
      N8N_RUNNERS_TASK_TIMEOUT: '600'
      N8N_RUNNERS_TASK_REQUEST_TIMEOUT: '300'
      NODE_FUNCTION_ALLOW_EXTERNAL: '*'
      NODE_FUNCTION_ALLOW_BUILTIN: 'crypto,path,fs,net,tls'
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify-shared
      - traefik.http.routers.n8n-automations.rule=Host(`automations.livetransparent.com`)
      - traefik.http.routers.n8n-automations.entrypoints=https
      - traefik.http.routers.n8n-automations.tls=true
      - traefik.http.routers.n8n-automations.service=n8n-automations
      - traefik.http.services.n8n-automations.loadbalancer.server.port=5678
    volumes:
      - 'n8n_data:/home/node/.n8n'
    networks:
      coolify-shared:
        aliases:
          - n8n

  n8n-runner:
    build:
      context: ./runners
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      N8N_RUNNERS_AUTH_TOKEN: '${N8N_RUNNERS_AUTH_TOKEN:?Set the runner authentication token}'
      N8N_RUNNERS_TASK_BROKER_URI: 'http://n8n:5679'
      N8N_RUNNERS_TASK_TIMEOUT: '600'
      NODE_PATH: '/opt/pg-node_modules'
    volumes:
      - './runners/n8n-task-runners.json:/etc/n8n-task-runners.json'
    networks:
      coolify-shared:
    depends_on:
      - n8n

volumes:
  n8n_data: null
networks:
  coolify-shared:
    external: true
