services:
  n8n:
    image: 'n8nio/n8n:2.33.3'
    restart: unless-stopped
    environment:
      # Core
      N8N_CONCURRENCY: '10'
      N8N_MIGRATE_FS_STORAGE_PATH: 'true'
      N8N_WEBHOOK_URL: 'https://automations.livetransparent.com/'
      N8N_UNVERIFIED_PACKAGES_ENABLED: 'true'
      # Must come from the persisted Coolify environment; never commit a key here.
      N8N_ENCRYPTION_KEY: '${N8N_ENCRYPTION_KEY:?Set the persisted n8n encryption key}'
      GENERIC_TIMEZONE: 'America/Los_Angeles'
      TZ: 'America/Los_Angeles'
      # External Task Runner (2026-08-11 migration)
      N8N_RUNNERS_MODE: 'external'
      N8N_RUNNERS_AUTH_TOKEN: '${N8N_RUNNERS_AUTH_TOKEN:?Set the runner authentication token}'
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: '0.0.0.0'
      N8N_RUNNERS_TASK_TIMEOUT: '600'
      N8N_RUNNERS_TASK_REQUEST_TIMEOUT: '300'
      NODE_FUNCTION_ALLOW_EXTERNAL: '*'
      NODE_FUNCTION_ALLOW_BUILTIN: 'crypto,path,fs,net,tls'
      # Compression
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: '2147483648'
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: '5000'
      # PostgreSQL (migrated from SQLite 2026-08-11)
      DB_TYPE: 'postgresdb'
      DB_POSTGRESDB_HOST: 'postgres'
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: 'n8n'
      DB_POSTGRESDB_USER: 'n8n'
      DB_POSTGRESDB_PASSWORD: '${POSTGRES_PASSWORD:?Set the n8n database password}'
      DB_POSTGRESDB_POOL_SIZE: '10'
      DB_POSTGRESDB_CONNECTION_TIMEOUT: '3000'
      DB_CONNECTION_ACQUISITION_TIMEOUT_MS: '10000'
      DB_POSTGRESDB_STATEMENT_TIMEOUT: '300000'
      DB_PING_TIMEOUT_MS: '5000'
      # Execution
      EXECUTIONS_TIMEOUT: '1800'
      EXECUTIONS_TIMEOUT_MAX: '3600'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=coolify-shared'
      - 'traefik.http.routers.n8n-automations.rule=Host(`automations.livetransparent.com`)'
      - 'traefik.http.routers.n8n-automations.entrypoints=https'
      - 'traefik.http.routers.n8n-automations.tls=true'
      - 'traefik.http.routers.n8n-automations.service=n8n-automations'
      - 'traefik.http.services.n8n-automations.loadbalancer.server.port=5678'
    volumes:
      - 'n8n_data:/home/node/.n8n'
    networks:
      coolify-shared:
        aliases:
          - n8n

  # External task runner container (2026-08-11)
  n8n-runner:
    image: 'n8nio/runners-custom:latest'
    restart: unless-stopped
    environment:
      N8N_RUNNERS_AUTH_TOKEN: '${N8N_RUNNERS_AUTH_TOKEN:?Set the runner authentication token}'
      N8N_RUNNERS_TASK_BROKER_URI: 'http://n8n:5679'
      N8N_RUNNERS_TASK_TIMEOUT: '600'
      NODE_PATH: '/opt/pg-node_modules'
    volumes:
      - './runners/n8n-task-runners.json:/etc/n8n-task-runners.json'
    networks:
      coolify-shared:
    depends_on:
      - n8n

volumes:
  n8n_data: null
networks:
  coolify-shared:
    external: true
